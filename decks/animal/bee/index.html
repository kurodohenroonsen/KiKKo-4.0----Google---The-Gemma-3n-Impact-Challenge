<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikko Microsite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="language-bar" class="language-bar">
        <!-- Les boutons de langue seront injectés ici -->
    </div>

    <div class="card-container">
        <header class="card-header">
            <div class="header-content">
                <div id="thumbnail-slideshow" class="thumbnail-slideshow">
                    <img id="thumbnail-image" src="" alt="Aperçu de l'image">
                    <div class="thumbnail-nav">
                        <button id="thumb-prev" aria-label="Previous thumbnail">‹</button>
                        <span id="thumb-counter"></span>
                        <button id="thumb-next" aria-label="Next thumbnail">›</button>
                    </div>
                </div>
                <div class="title-block">
                    <h1 id="card-title"></h1>
                    <h2 id="scientific-name"></h2>
                    <div id="forger-info" class="forger-info"></div>
                </div>
            </div>
        </header>

        <main class="card-body">
            <div class="content-column">
                <section class="stats-section">
                    <h3 id="stats-header"></h3>
                    <div id="stats-container" class="stats-container">
                        <!-- Les stats seront injectées ici -->
                    </div>
                </section>

                <section class="description-section">
                    <h3 id="description-header"></h3>
                    <p id="card-description"></p>
                </section>

                <section class="fun-facts-section">
                    <h3 id="fun-facts-header"></h3>
                    <ul id="fun-facts-list"></ul>
                </section>
            </div>
        </main>
    </div>

    <!-- BOUTONS FLOTTANTS -->
    <button id="quiz-floating-button" class="floating-button quiz-button" aria-label="Open Quiz">🧠</button>
    <button id="bourdon-floating-button" class="floating-button bourdon-button" aria-label="Open Bourdon's Report">🗣️</button>

    <!-- MODALS -->
    <div id="gallery-modal" class="modal">
        <span class="close-button" aria-label="Close">×</span>
        <div class="gallery-modal-content">
            <button id="modal-prev" class="gallery-nav prev" aria-label="Previous image">❮</button>
            <img id="modal-image" src="" alt="Image en grand format">
            <button id="modal-next" class="gallery-nav next" aria-label="Next image">❯</button>
        </div>
    </div>

    <div id="quiz-modal" class="modal">
        <div class="modal-content quiz-modal-content">
            <span class="close-button" aria-label="Close">×</span>
            <h3 id="quiz-modal-header"></h3>
            <div id="quiz-modal-container"></div>
        </div>
    </div>

    <div id="monologue-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" aria-label="Close">×</span>
            <h3 id="monologue-modal-header"></h3>
            <div class="tts-controls">
                <select id="monologue-voice-select"></select>
                <button id="monologue-play-pause-button" aria-label="Play/Pause">▶️</button>
                <button id="monologue-stop-button" aria-label="Stop">⏹️</button>
            </div>
            <p id="monologue-modal-text"></p>
        </div>
    </div>

    <div id="provenance-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" aria-label="Close">×</span>
            <h3 id="provenance-header"></h3>
            <div id="provenance-details"></div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/provenance.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
